name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify installed dependency metadata boundary
        run: |
          python - <<'PY'
          from importlib.metadata import distribution

          from packaging.requirements import Requirement

          requirements = [
              Requirement(value)
              for value in (distribution("signal-validation-model").requires or [])
          ]
          by_name = {requirement.name: requirement for requirement in requirements}
          assert set(by_name) == {"pytest", "nfl_data_py", "pandas"}

          for name in ("nfl_data_py", "pandas"):
              requirement = by_name[name]
              assert requirement.marker is not None
              assert not requirement.marker.evaluate({"extra": "", "python_version": "3.11"})
              assert requirement.marker.evaluate(
                  {"extra": "legacy-local-builder", "python_version": "3.11"}
              )
              assert not requirement.marker.evaluate(
                  {"extra": "legacy-local-builder", "python_version": "3.12"}
              )
          print("installed dependency metadata boundary passed")
          PY
      - run: python -m pip check
      - run: python -m pytest -q
      - run: signal-validation --help
      - run: python scripts/build_real_wr_data.py --help
      - name: Verify repository remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"

  legacy-local-builder:
    name: Legacy extra dependency smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,legacy-local-builder]'
      - run: python -m pip check
      - name: Verify legacy dependency envelope
        run: |
          python - <<'PY'
          import pandas
          import nfl_data_py

          major, minor = (int(part) for part in pandas.__version__.split(".")[:2])
          assert (1, 5) <= (major, minor) < (2, 0)
          print("legacy dependency smoke passed")
          PY
      - name: Verify installed legacy CLI outside checkout
        run: >-
          python -m pytest -q
          tests/test_installed_cli_boundary.py::test_installed_cli_reaches_packaged_legacy_builder_outside_checkout
      - run: python -m pytest -q
      - name: Verify repository remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"

  unsupported-legacy-extra:
    name: Legacy extra fail-closed on Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,legacy-local-builder]'
      - run: python -m pip check
      - name: Verify marked dependencies stay absent
        run: |
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("nfl_data_py") is None
          assert importlib.util.find_spec("pandas") is None
          print("unsupported legacy extra dependencies remain absent")
          PY
      - name: Verify installed CLI fails closed outside checkout
        run: >-
          python -m pytest -q
          tests/test_installed_cli_boundary.py::test_installed_cli_fails_closed_outside_checkout_on_unsupported_python
      - run: python -m pytest -q
      - name: Verify repository remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"

  cross-platform-research-determinism:
    name: Cross-platform research determinism
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Build exact research inputs from CRLF transport copies
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "player-season-lf.json"
          $playerCrlf = Join-Path $env:RUNNER_TEMP "player-season-crlf.json"
          $pilotCrlf = Join-Path $env:RUNNER_TEMP "pilot-crlf.json"
          $output = Join-Path $env:RUNNER_TEMP "portable-output"

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/Prometheus-Frameworks/TIBER-Data/3606b6a0af5add2ebea1f7de141a299cebe70a34/exports/promoted/nfl/player_season_coverage_v0.json" `
            -OutFile $source

          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $playerText = [System.IO.File]::ReadAllText($source)
          [System.IO.File]::WriteAllText(
            $playerCrlf,
            ($playerText -replace "`r?`n", "`r`n"),
            $utf8
          )
          $pilotText = [System.IO.File]::ReadAllText(
            "data/raw/late_veteran_wr_breakout_2026_pilot_receipts_v0.json"
          )
          [System.IO.File]::WriteAllText(
            $pilotCrlf,
            ($pilotText -replace "`r?`n", "`r`n"),
            $utf8
          )

          signal-validation build-late-veteran-wr-breakout-v0 `
            --player-season-input $playerCrlf `
            --pilot-receipts-input $pilotCrlf `
            --output-dir $output

          $env:TIBER_PORTABLE_OUTPUT = $output
          @'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["TIBER_PORTABLE_OUTPUT"])
          for path in root.rglob("*"):
              if path.is_file() and b"\r\n" in path.read_bytes():
                  raise SystemExit(f"CRLF output detected: {path}")

          receipt_path = (
              root
              / "validation_reports"
              / "late_veteran_wr_breakout_v0_receipt.json"
          )
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          implementation_paths = {
              binding["relative_path"]
              for binding in receipt["implementation_bindings"]
          }
          assert "src/reporting/late_veteran_wr_breakout_portable.py" in implementation_paths
          assert all("\\" not in value for value in implementation_paths)
          for binding in receipt["output_bindings"]:
              relative = binding["relative_path"]
              assert "\\" not in relative
              path = root.joinpath(*relative.split("/"))
              assert hashlib.sha256(path.read_bytes()).hexdigest() == binding["content_sha256"]
          print("Windows CRLF transport and LF artifact determinism passed")
          '@ | python -
      - name: Verify repository remains clean
        shell: pwsh
        run: |
          $dirty = git status --porcelain --untracked-files=all
          if ($dirty) {
            Write-Host $dirty
            exit 1
          }
