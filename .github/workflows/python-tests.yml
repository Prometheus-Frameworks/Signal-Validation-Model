name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify installed dependency metadata boundary
        run: |
          python - <<'PY'
          from importlib.metadata import distribution

          from packaging.requirements import Requirement

          requirements = [
              Requirement(value)
              for value in (distribution("signal-validation-model").requires or [])
          ]
          by_name = {requirement.name: requirement for requirement in requirements}
          assert set(by_name) == {"pytest", "nfl_data_py", "pandas"}

          for name in ("nfl_data_py", "pandas"):
              requirement = by_name[name]
              assert requirement.marker is not None
              assert not requirement.marker.evaluate({"extra": "", "python_version": "3.11"})
              assert requirement.marker.evaluate(
                  {"extra": "legacy-local-builder", "python_version": "3.11"}
              )
              assert not requirement.marker.evaluate(
                  {"extra": "legacy-local-builder", "python_version": "3.12"}
              )
          print("installed dependency metadata boundary passed")
          PY
      - run: python -m pip check
      - run: python -m pytest -q
      - run: signal-validation --help
      - run: python scripts/build_real_wr_data.py --help
      - name: Verify repository remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"

  legacy-local-builder:
    name: Legacy extra dependency smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,legacy-local-builder]'
      - run: python -m pip check
      - name: Verify legacy dependency envelope
        run: |
          python - <<'PY'
          import pandas
          import nfl_data_py

          major, minor = (int(part) for part in pandas.__version__.split(".")[:2])
          assert (1, 5) <= (major, minor) < (2, 0)
          print("legacy dependency smoke passed")
          PY
      - name: Verify installed legacy CLI outside checkout
        run: >-
          python -m pytest -q
          tests/test_installed_cli_boundary.py::test_installed_cli_reaches_packaged_legacy_builder_outside_checkout
      - run: python -m pytest -q
      - name: Verify repository remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"

  unsupported-legacy-extra:
    name: Legacy extra fail-closed on Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,legacy-local-builder]'
      - run: python -m pip check
      - name: Verify marked dependencies stay absent
        run: |
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("nfl_data_py") is None
          assert importlib.util.find_spec("pandas") is None
          print("unsupported legacy extra dependencies remain absent")
          PY
      - name: Verify installed CLI fails closed outside checkout
        run: >-
          python -m pytest -q
          tests/test_installed_cli_boundary.py::test_installed_cli_fails_closed_outside_checkout_on_unsupported_python
      - run: python -m pytest -q
      - name: Verify repository remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
