name: PR 17 one-shot repair

on:
  push:
    branches:
      - agent/late-veteran-wr-breakout-v0

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/late-veteran-wr-breakout-v0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Refresh branch from current main
        run: |
          git config user.name "TIBER repair workflow"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply bounded cross-platform determinism repair
        shell: python
        run: |
          from pathlib import Path

          reporting = Path('src/reporting/late_veteran_wr_breakout.py')
          text = reporting.read_text(encoding='utf-8')

          replacements = [
              (
                  '    examples_path.write_text(examples_markdown, encoding="utf-8")\n',
                  '    _write_text_lf(examples_path, examples_markdown)\n',
              ),
              (
                  '                "relative_path": str(path.relative_to(repository_root)),\n',
                  '                "relative_path": path.relative_to(repository_root).as_posix(),\n',
              ),
              (
                  '                "relative_path": str(path.relative_to(base_output)),\n',
                  '                "relative_path": path.relative_to(base_output).as_posix(),\n',
              ),
              (
                  '''def _write_json(path: Path, payload: Mapping[str, Any]) -> None:\n    path.write_text(\n        json.dumps(payload, indent=2, sort_keys=True, ensure_ascii=False) + "\\n",\n        encoding="utf-8",\n    )\n\n\n''',
                  '''def _write_json(path: Path, payload: Mapping[str, Any]) -> None:\n    _write_text_lf(\n        path,\n        json.dumps(payload, indent=2, sort_keys=True, ensure_ascii=False) + "\\n",\n    )\n\n\ndef _write_text_lf(path: Path, text: str) -> None:\n    """Write deterministic UTF-8/LF bytes on every supported platform."""\n\n    with path.open("w", encoding="utf-8", newline="\\n") as handle:\n        handle.write(text)\n\n\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one reporting replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          reporting.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_late_veteran_wr_breakout_pipeline.py')
          test_text = test_path.read_text(encoding='utf-8')
          anchor = '    assert receipt["run_guards"]["receipt_self_hash_excluded"] is True\n'
          addition = '''    assert receipt["run_guards"]["receipt_self_hash_excluded"] is True\n    for binding_group in ("implementation_bindings", "output_bindings"):\n        assert all(\n            "\\\\" not in binding["relative_path"]\n            for binding in receipt[binding_group]\n        )\n    for output_path in _artifact_paths(result):\n        assert b"\\r\\n" not in output_path.read_bytes()\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit('pipeline test insertion anchor moved')
          test_path.write_text(test_text.replace(anchor, addition, 1), encoding='utf-8', newline='\n')

          attrs = Path('.gitattributes')
          attrs.write_text(
              '# Keep digest-pinned research inputs and generated artifacts byte-stable.\n'
              'data/raw/late_veteran_wr_breakout_2026_pilot_receipts_v0.json text eol=lf\n'
              'outputs/validation_reports/late_veteran_wr_breakout_v0_* text eol=lf\n'
              'outputs/case_studies/late_veteran_wr_breakout_* text eol=lf\n',
              encoding='utf-8',
              newline='\n',
          )

          workflow = Path('.github/workflows/python-tests.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          marker = '  cross-platform-research-determinism:\n'
          if marker in workflow_text:
              raise SystemExit('cross-platform workflow job already exists')
          workflow_text = workflow_text.rstrip() + '''\n\n  cross-platform-research-determinism:\n    name: Cross-platform research determinism\n    runs-on: windows-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n          cache: pip\n      - run: python -m pip install --upgrade pip\n      - run: python -m pip install -e ".[dev]"\n      - run: python -m pip check\n      - run: python -m pytest -q\n      - name: Verify repository remains clean\n        shell: pwsh\n        run: |\n          $dirty = git status --porcelain --untracked-files=all\n          if ($dirty) {\n            Write-Host $dirty\n            exit 1\n          }\n'''
          workflow.write_text(workflow_text, encoding='utf-8', newline='\n')

      - name: Install and run full suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
          python -m pytest -q

      - name: Rebuild the exact real-input artifacts twice
        run: |
          mkdir -p /tmp/tiber-data
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Prometheus-Frameworks/TIBER-Data/3606b6a0af5add2ebea1f7de141a299cebe70a34/exports/promoted/nfl/player_season_coverage_v0.json \
            --output /tmp/tiber-data/player_season_coverage_v0.json
          echo 'd45f612b207085df00b4b080e4f55ce1abbd060dcbf30b0bee777ff833ddd8ac  /tmp/tiber-data/player_season_coverage_v0.json' | sha256sum --check
          signal-validation build-late-veteran-wr-breakout-v0 \
            --player-season-input /tmp/tiber-data/player_season_coverage_v0.json \
            --output-dir /tmp/run-a
          signal-validation build-late-veteran-wr-breakout-v0 \
            --player-season-input /tmp/tiber-data/player_season_coverage_v0.json \
            --output-dir /tmp/run-b
          diff -ru /tmp/run-a /tmp/run-b
          python - <<'PY'
          import json
          from pathlib import Path

          for root in (Path('/tmp/run-a'), Path('/tmp/run-b')):
              for path in root.rglob('*'):
                  if path.is_file() and b'\r\n' in path.read_bytes():
                      raise SystemExit(f'CRLF output detected: {path}')
              receipt = json.loads(
                  (root / 'validation_reports/late_veteran_wr_breakout_v0_receipt.json').read_text(encoding='utf-8')
              )
              for group in ('implementation_bindings', 'output_bindings'):
                  for binding in receipt[group]:
                      if '\\' in binding['relative_path']:
                          raise SystemExit(f'non-POSIX receipt path: {binding}')
          print('real-input deterministic rebuild passed')
          PY

      - name: Commit refreshed, validated candidate
        run: |
          git rm .github/workflows/pr17-one-shot-repair.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: harden late-veteran WR reproducibility"
          git push origin HEAD:agent/late-veteran-wr-breakout-v0
